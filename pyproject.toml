[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "autofinetune"
version = "0.1.0"
description = "Closed-loop domain-knowledge fine-tuning agent"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "typer>=0.12",
  "rich>=13.0",
  "pydantic>=2.6",
  "pydantic-settings>=2.2",
  "pyyaml>=6.0",
  "litellm>=1.40",
  "httpx>=0.27",
]

[project.optional-dependencies]
train = [
  "torch",
  "transformers>=4.44",
  "peft>=0.12",
  "trl>=0.9",
  "datasets>=2.20",
  "accelerate>=0.33",
  "pypdf>=4.0",
]
mlx = [
  "mlx",
  "mlx-lm[train]",
]
dev = [
  "pytest>=8.0",
  "autofinetune[train]",
]

[project.scripts]
autofinetune = "autofinetune.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/autofinetune"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
